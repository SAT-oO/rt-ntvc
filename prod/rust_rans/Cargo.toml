[package]
name = "commavq_rans"
version = "0.1.0"
edition = "2021"

[lib]
name = "commavq_rans"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
proptest = "1.4"
rand = "0.8"
