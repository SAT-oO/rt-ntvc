[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "commavq-prod"
version = "0.1.0"
description = "Production neural video-token runtime"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "datasets>=2.0",
    "huggingface_hub>=0.16",
    "constriction>=0.4",
    "hypothesis>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
eval = [
    "lpips>=0.1",
    "torchmetrics>=1.0",
    "pillow>=10.0",
    "av>=12.0",
]
dev = [
    "mypy>=1.8",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.maturin]
manifest-path = "rust_rans/Cargo.toml"
module-name = "commavq_prod._rans"
python-source = "src"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["commavq_prod"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "constriction.*",
    "lpips.*",
    "torchmetrics.*",
    "av.*",
    "datasets.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["commavq_prod"]
omit = [
    "*/commavq_prod/eval/classical.py",
    "*/commavq_prod/eval/harness.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
